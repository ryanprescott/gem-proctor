# gem-proctor stack (SPEC §11.5, P0.md S2). From the repo root: `docker compose up --build`
# (the root compose.yaml includes this file; values come from the root .env).
name: gem-proctor

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gem_proctor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      GEM_OWNER_PASSWORD: ${GEM_OWNER_PASSWORD:?set GEM_OWNER_PASSWORD in .env}
      GEM_APP_PASSWORD: ${GEM_APP_PASSWORD:?set GEM_APP_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql.tpl:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: { context: .., dockerfile: docker/web.Dockerfile }
    volumes:
      - web-dist:/web-dist
    restart: "no"

  api:
    build: { context: .., dockerfile: docker/api.Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      web: { condition: service_completed_successfully }
      verify: { condition: service_started }
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: postgres://gem_app:${GEM_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-gem_proctor}
      DATABASE_URL_OWNER: postgres://gem_owner:${GEM_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:-gem_proctor}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ENDPOINT_SECRET_KEY: ${ENDPOINT_SECRET_KEY:-}
      VERIFY_SOCKET: /run/verify/verify.sock
      WEB_DIST: /web-dist
      MIGRATE_ON_START: "true"
      # PDF upload (docs/P2.2.md): with the `convert` profile, CONVERT_URL=http://convert:8200. Unset, upload is off.
      CONVERT_URL: ${CONVERT_URL:-}
      CONVERT_SHARED_SECRET: ${CONVERT_SHARED_SECRET:-}
    volumes:
      - verify-socket:/run/verify
      - web-dist:/web-dist:ro
    # A model server on the Docker host (and CI's mock) is reachable as host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    restart: unless-stopped

  # Runs model-written programs; isolation is the security (SPEC §3A.3.1). The parent exits to recycle, and the
  # restart policy brings it back with a fresh tmpfs. The API holds no Docker socket.
  verify:
    build: { context: .., dockerfile: docker/verify.Dockerfile }
    network_mode: none # no interface besides loopback
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 1g
    cpus: 1.0
    # No environment variables and no secrets: nothing is passed in, and the entrypoint runs under `env -i`.
    volumes:
      - verify-socket:/run/verify
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/python",
          "-I",
          "-B",
          "-c",
          "import socket; s = socket.socket(socket.AF_UNIX); s.connect('/run/verify/verify.sock'); s.sendall(b'{\"kind\":\"health\"}\\n'); assert b'\"ok\":true' in s.recv(4096)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # PDF converter (docs/P2.2.md §5): `docker compose --profile convert up`. Marker with no GPU and no secrets, its weights
  # in the image, a read-only root, and a limit on CPU and memory so a conversion takes only what the API and Postgres
  # leave. Its page reads go to the API's proxy (role `document.ocr`, the same queue as every model call), with the
  # shared secret as the key: its one credential, which opens that proxy and nothing else (scripts/check-convert.ts).
  # CONVERT_VLM_UPSTREAM instead sends them straight to an Ollama, through a development shim: for the converter alone.
  convert:
    profiles: ["convert"]
    build: { context: .., dockerfile: docker/convert.Dockerfile }
    read_only: true
    tmpfs:
      - /work:size=1g,mode=0700,uid=10003,gid=10003
      - /cache:size=128m,mode=0700,uid=10003,gid=10003
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: ${CONVERT_MEM_LIMIT:-6g}
    cpus: ${CONVERT_CPUS:-2.0}
    environment:
      CONVERT_VLM_UPSTREAM: ${CONVERT_VLM_UPSTREAM:-}
      SURYA_INFERENCE_URL: ${CONVERT_VLM_URL:-http://api:${API_PORT:-3000}/internal/vlm/v1}
      # Surya's vLLM client is the one that sends a key (VLLM_API_KEY); its llama.cpp client always sends "EMPTY".
      # No server is started either way: the URL is given.
      SURYA_INFERENCE_BACKEND: vllm
      VLLM_API_KEY: ${CONVERT_SHARED_SECRET:-}
    ports:
      - "127.0.0.1:${CONVERT_PORT:-8200}:8200"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=4))['ok']",
        ]
      interval: 15s
      timeout: 6s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  verify-socket:
  web-dist:
