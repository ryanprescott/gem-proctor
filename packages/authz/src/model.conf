# Casbin model (SPEC §5.2). Policy lines (p, and role → role inheritance) are in policy.csv, changed only
# through code review. User → role grants (g, <userId>, <role>) live in Postgres (casbin_rule).
#
# r.rel is the caller's relationship to the resource ("owner", "member" or "none"). The API's preHandler
# loads the resource's owner or groups and passes it, so every request value is a string and decisions
# can be cached by Casbin's CachedEnforcer.

[request_definition]
r = sub, obj, act, rel

[policy_definition]
p = sub, obj, act, cond

[role_definition]
g = _, _

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = g(r.sub, p.sub) && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act) && (p.cond == "any" || p.cond == r.rel)
