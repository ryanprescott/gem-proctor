[project]
name = "gem-convert"
version = "0.0.0"
description = "gem-proctor PDF converter (docs/P2.2.md)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# The docs use × and § on purpose.
ignore = ["S101", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests read and write throwaway files and local URLs on purpose.
"tests/*" = ["S", "RUF001", "RUF002", "E501"]
