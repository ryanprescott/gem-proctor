[project]
name = "gem-verify"
version = "0.0.0"
description = "gem-proctor verification sandbox (P0 skeleton: health only)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]
